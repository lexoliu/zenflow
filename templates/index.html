<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="{{ asset_prefix }}assets/style.css">
  <style>
    .page { max-width: 1200px; margin: 0 auto; padding: 12px 20px 40px; }
    .page header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .logo { margin: 0; }
    .locale-switch { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .locale-switch select { padding: 8px 10px; border: 2px solid var(--foreground); background: var(--background); color: var(--foreground); }
    .search-bar { display: flex; align-items: center; gap: 12px; margin-top: 10px; border: 2px solid var(--foreground); padding: 10px 12px; box-shadow: 0 0 0 3px rgba(99, 124, 255, 0.28); }
    .search-input { flex: 1; padding: 6px 0; border: none; background: transparent; color: var(--foreground); font-size: 20px; outline: none; }
    .icon-button { border: none; background: transparent; color: #666; cursor: pointer; font-size: 18px; display: none; }
    .icon-button:hover { color: var(--foreground); }
    .search-bar.active .icon-button { display: inline-flex; }
    .search-results .hit { margin-top: 16px; padding: 16px; border: 2px solid var(--foreground); }
    .search-results .hit a { font-weight: bold; }
    .muted { opacity: 0.7; }
    .hidden { display: none; }
  </style>
  <title>Zenflow</title>
</head>
<body>
  <div class="page">
    <header>
      <h1 class="logo">{{ site_title }}</h1>
      {% if has_locale_switch %}
      <label class="locale-switch" for="locale-select">
        <span>Language</span>
        <select id="locale-select">
          {% for locale in locales %}
          <option value="{{ locale }}">{{ locale }}</option>
          {% endfor %}
        </select>
      </label>
      {% endif %}
    </header>
    <div class="search-bar" id="search-bar">
      <input class="search-input" id="search-input" type="search" placeholder="Search articles..." />
      <button class="icon-button" id="clear-btn" aria-label="Clear search">✕</button>
    </div>
    <div id="locale-data" data-locales='{{ locales_json }}' class="hidden"></div>
    <div class="padding">
    <div id="entries-container">
      {% if has_entries %}
      {% for entry in entries %}
      <div class="flex border padding" data-locale="{{ entry.locale }}" data-default-locale="{{ entry.default_locale }}">
        <h2>{{ entry.title }}</h2>
        <a class="text-right" href="{{ entry.href }}">Read more</a>
      </div>
      {% endfor %}
      {% else %}
      <div class="flex border padding">
        <p class="muted">No articles yet. Start writing!</p>
      </div>
      {% endif %}
    </div>
    <div id="search-results" class="search-results hidden"></div>
    <footer>{{ footer }}</footer>
  </div>
  </div>
  <script src="{{ search_js }}" defer></script>
  <script>
    const availableLocales = (() => {
      const el = document.getElementById('locale-data');
      if (!el) return [];
      try {
        return JSON.parse(el.dataset.locales || '[]');
      } catch (_) {
        return [];
      }
    })();
    const storageKey = 'zenflow:preferred-locale';
    const input = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-btn');
    const searchBar = document.getElementById('search-bar');
    const entries = document.getElementById('entries-container');
    const resultsEl = document.getElementById('search-results');
    const localeSelect = document.getElementById('locale-select');

    function normalizeLocale(locale) {
      return (locale || '').toLowerCase();
    }

    function pickPreferredLocale() {
      const saved = window.localStorage.getItem(storageKey);
      if (saved && availableLocales.some(l => normalizeLocale(l) === normalizeLocale(saved))) {
        return saved;
      }
      const nav = navigator.language || navigator.userLanguage;
      if (nav) {
        const direct = availableLocales.find(l => normalizeLocale(l) === normalizeLocale(nav));
        if (direct) return direct;
        const base = nav.split('-')[0];
        const baseMatch = availableLocales.find(l => normalizeLocale(l) === normalizeLocale(base));
        if (baseMatch) return baseMatch;
      }
      return availableLocales[0] || '';
    }

    let preferredLocale = pickPreferredLocale();

    function persistLocale(next) {
      if (!next) return;
      preferredLocale = next;
      try { window.localStorage.setItem(storageKey, preferredLocale); } catch (_) {}
      if (input.value.trim()) {
        runSearch();
      }
    }

    if (localeSelect && preferredLocale) {
      localeSelect.value = preferredLocale;
      localeSelect.addEventListener('change', (event) => {
        persistLocale(event.target.value);
      });
    }

    function showEntries() {
      entries.classList.remove('hidden');
      resultsEl.classList.add('hidden');
      resultsEl.innerHTML = '';
    }

    function showResults() {
      entries.classList.add('hidden');
      resultsEl.classList.remove('hidden');
    }

    function renderResults(hits) {
      if (!hits || hits.length === 0) {
        resultsEl.innerHTML = '<p class="muted">No results.</p>';
        showResults();
        return;
      }
      resultsEl.innerHTML = hits.map(hit => {
        const desc = hit.description ? `<p class="muted">${hit.description}</p>` : '';
        return `<div class="hit"><a href="${hit.permalink}">${hit.title}</a>${desc}</div>`;
      }).join('');
      showResults();
    }

    function clearSearch() {
      input.value = '';
      showEntries();
      searchBar.classList.remove('active');
    }

    function updateSearchState() {
      const active = input.value.trim().length > 0;
      searchBar.classList.toggle('active', active);
    }

    async function runSearch() {
      const query = input.value.trim();
      updateSearchState();
      if (!query) { showEntries(); return; }
      try {
        if (!window.ThoughtSearch || typeof window.ThoughtSearch.search !== 'function') {
          resultsEl.innerHTML = '<p class="muted">Preparing search…</p>';
          showResults();
          return;
        }
        await window.ThoughtSearch.ready();
        const result = await window.ThoughtSearch.search(query, preferredLocale);
        const hits = Array.isArray(result) ? result : (result && result.hits) ? result.hits : [];
        renderResults(hits);
      } catch (err) {
        resultsEl.innerHTML = `<p class="muted">Search failed: ${err}</p>`;
        showResults();
      }
    }
    input.addEventListener('input', runSearch);
    input.addEventListener('keydown', (event) => { if (event.key === 'Escape') { clearSearch(); } });
    clearBtn.addEventListener('click', () => { clearSearch(); input.focus(); });
  </script>
</body>
</html>
