<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="{{ asset_prefix }}assets/style.css">
  <style>
    .page { max-width: 1100px; margin: 0 auto; padding: 12px 20px 40px; }
    .page-header { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
    .search-bar { display: flex; align-items: center; gap: 10px; border: 2px solid var(--foreground); padding: 8px 10px; box-shadow: 0 0 0 3px rgba(99, 124, 255, 0.28); }
    .search-input { flex: 1; padding: 6px 0; border: none; background: transparent; color: var(--foreground); font-size: 18px; box-sizing: border-box; outline: none; }
    .icon-button { border: none; background: transparent; color: #666; cursor: pointer; font-size: 16px; display: none; }
    .icon-button:hover { color: var(--foreground); }
    .search-bar.active .icon-button { display: inline-flex; }
    .search-results .hit { margin-top: 16px; padding: 16px; border: 2px solid var(--foreground); }
    .search-results .hit a { font-weight: bold; }
    .muted { opacity: 0.7; }
    .article-body { margin-top: 12px; }
    .article-body > h1:first-child,
    .article-body > h2:first-child { display: none; }
    .lang-switch { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .lang-switch label { font-weight: bold; }
    .lang-switch select { padding: 8px 12px; border: 2px solid var(--foreground); background: var(--background); color: var(--foreground); }
    .hidden { display: none; }
  </style>
  <title>{{ title }}</title>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1><a href="{{ asset_prefix }}index.html">{{ site_title }}</a></h1>
      <div class="search-bar" id="search-container">
        <input class="search-input" id="search-input" type="search" placeholder="Search articles..." />
        <button class="icon-button" id="clear-btn" aria-label="Clear search">✕</button>
      </div>
    </div>
    <div class="padding">
    <h2># {{ title }}</h2>
    <p>By {{ author }} · {{ created }}</p>
    {% if has_translations %}
    <div class="lang-switch">
      <label for="lang-select">Language</label>
      <select id="lang-select">
        {% for lang in translations %}
        <option value="{{ lang.locale }}" data-href="{{ lang.href }}" {% if lang.selected %}selected{% endif %}>{{ lang.locale }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}
    <div class="flex border padding article-body">{{ body|safe }}</div>
    <div id="search-results" class="search-results"></div>
    <footer>{{ footer }}</footer>
  </div>
  </div>
  <script src="{{ search_js }}" defer></script>
  <script>
    const storageKey = 'zenflow:preferred-locale';
    const input = document.getElementById('search-input');
    const container = document.getElementById('search-container');
    const clearBtn = document.getElementById('clear-btn');
    const resultsEl = document.getElementById('search-results');
    const langSelect = document.getElementById('lang-select');
    const availableLocales = langSelect ? Array.from(langSelect.options).map(opt => opt.value) : [];

    function normalizeLocale(locale) {
      return (locale || '').toLowerCase();
    }

    function pickPreferredLocale() {
      const saved = window.localStorage.getItem(storageKey);
      if (saved && availableLocales.some(l => normalizeLocale(l) === normalizeLocale(saved))) {
        return saved;
      }
      const nav = navigator.language || navigator.userLanguage;
      if (nav) {
        const direct = availableLocales.find(l => normalizeLocale(l) === normalizeLocale(nav));
        if (direct) return direct;
        const base = nav.split('-')[0];
        const baseMatch = availableLocales.find(l => normalizeLocale(l) === normalizeLocale(base));
        if (baseMatch) return baseMatch;
      }
      return availableLocales[0] || '';
    }

    let preferredLocale = availableLocales.length ? pickPreferredLocale() : '';

    function persistLocale(next) {
      if (!next) return;
      preferredLocale = next;
      try { window.localStorage.setItem(storageKey, preferredLocale); } catch (_) {}
    }

    if (langSelect) {
      const current = langSelect.selectedOptions[0]?.value || '';
      if (preferredLocale && normalizeLocale(preferredLocale) !== normalizeLocale(current)) {
        const target = Array.from(langSelect.options).find(opt => normalizeLocale(opt.value) === normalizeLocale(preferredLocale));
        if (target?.dataset?.href) {
          window.location.href = target.dataset.href;
        }
      }
      if (preferredLocale) {
        langSelect.value = preferredLocale;
      }
      langSelect.addEventListener('change', (event) => {
        const selected = event.target.selectedOptions[0];
        const href = selected?.dataset?.href;
        const locale = selected?.value;
        if (locale) {
          persistLocale(locale);
        }
        if (href) {
          window.location.href = href;
        }
      });
    }

    function renderResults(hits) {
      if (!hits || hits.length === 0) {
        resultsEl.innerHTML = '<p class="muted">No results.</p>';
        return;
      }
      resultsEl.innerHTML = hits.map(hit => {
        const desc = hit.description ? `<p class="muted">${hit.description}</p>` : '';
        return `<div class="hit"><a href="${hit.permalink}">${hit.title}</a>${desc}</div>`;
      }).join('');
    }
    async function runSearch() {
      const query = input.value.trim();
      container.classList.toggle('active', query.length > 0);
      if (!query) { resultsEl.innerHTML = ''; return; }
      try {
        if (!window.ThoughtSearch || typeof window.ThoughtSearch.search !== 'function') {
          resultsEl.innerHTML = '<p class="muted">Preparing search…</p>';
          return;
        }
        await window.ThoughtSearch.ready();
        const result = await window.ThoughtSearch.search(query, preferredLocale);
        const hits = Array.isArray(result) ? result : (result && result.hits) ? result.hits : [];
        renderResults(hits);
      } catch (err) {
        resultsEl.innerHTML = `<p class="muted">Search failed: ${err}</p>`;
      }
    }
    input.addEventListener('input', runSearch);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        input.value = '';
        container.classList.remove('active');
        resultsEl.innerHTML = '';
      }
    });
    clearBtn.addEventListener('click', () => {
      input.value = '';
      container.classList.remove('active');
      resultsEl.innerHTML = '';
      input.focus();
    });
  </script>
</body>
</html>
